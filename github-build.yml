# Builds the offline installers on GitHub's own Windows and macOS machines.
# Run it from the repo's "Actions" tab -> "Build installers" -> "Run workflow".
# Download the results from the finished run's "Artifacts" section.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: dist/*.exe
          - os: macos-latest          # Apple silicon (arm64)
            target: mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron tooling
        run: npm install

      - name: Build scanning engine (PyInstaller)
        run: npm run build:backend:${{ matrix.target }}

      - name: Build installer
        run: npx electron-builder --${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
