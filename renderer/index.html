<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:*">
  <title>Sentinel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail">
      <div class="logo" title="Sentinel">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <button data-view="dashboard" class="active" title="Dashboard"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 1 1 16 0"/><path d="m12 15 4-5"/></svg></button>
      <button data-view="ports" title="Open ports"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4M11 10v4M15 10v4"/></svg></button>
      <button data-view="network" title="Network monitor"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="dot" id="netDot" hidden></span></button>
      <button data-view="vulns" title="Vulnerabilities &amp; patches"><svg viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 10v4M12 17v.5"/></svg></button>
      <button data-view="advisor" title="AI advisor"><svg viewBox="0 0 24 24"><path d="M12 3v3M5 8l2 2M19 8l-2 2"/><rect x="6" y="10" width="12" height="9" rx="3"/><path d="M10 14h.01M14 14h.01"/></svg></button>
      <div class="spacer"></div>
      <button data-view="settings" title="Settings &amp; threat intel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    </nav>

    <main class="main">
      <header class="topbar">
        <div class="title">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 15a8 8 0 1 1 16 0" fill="none" stroke="#3987e5" stroke-width="2"/></svg>
          <h1 id="viewTitle">Runtime Security</h1>
          <span class="badge-mode" id="hostBadge"></span>
        </div>
        <div class="banner" id="adminBanner" hidden>
          Limited visibility - some processes are hidden without administrator rights.
          <button class="link" id="elevateBtn">Grant admin access</button>
        </div>
        <div class="top-actions">
          <span class="muted" id="lastScan">Not scanned yet</span>
          <label class="toggle" title="Also query the OS for missing patches (slower)"><input type="checkbox" id="deepScan"> Deep patch scan</label>
          <button class="btn primary" id="scanBtn">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            Scan now
          </button>
        </div>
      </header>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-ports" hidden></section>
      <section class="view" id="view-network" hidden></section>
      <section class="view" id="view-vulns" hidden></section>
      <section class="view" id="view-advisor" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="modal-back" id="modal" hidden><div class="modal" id="modalBody"></div></div>
  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
